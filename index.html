<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dissington City</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dissington City" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <!-- Dissington City logo -->
      <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <rect x="9" y="9" width="6" height="12" rx="3"/>
        <ellipse cx="12" cy="9" rx="4" ry="3.5"/>
        <ellipse cx="8.5" cy="21" rx="3" ry="2.5"/>
        <ellipse cx="15.5" cy="21" rx="3" ry="2.5"/>
      </svg>
      <span class="logo-text">Dissington City</span>

      <!-- Theme switcher tab -->
      <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-tab" id="themeTabBtn" title="Change theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span id="themeLabel">Theme 1</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="10" height="10" id="themeChevron">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="theme-dropdown" id="themeDropdown" hidden>
          <button class="theme-option active" data-theme="1">
            <span class="theme-swatches">
              <span style="background:#0d0d12"></span>
              <span style="background:#a855f7"></span>
              <span style="background:#f0eff5"></span>
            </span>
            <span>Theme 1 — Dark Universe</span>
          </button>
          <button class="theme-option" data-theme="2">
            <span class="theme-swatches">
              <span style="background:#f5cba7"></span>
              <span style="background:#8b5e3c"></span>
              <span style="background:#e8c547"></span>
            </span>
            <span>Theme 2 — Biological</span>
          </button>
          <button class="theme-option" data-theme="3">
            <span class="theme-swatches">
              <span style="background:#ff69b4"></span>
              <span style="background:#c0c0c0"></span>
              <span style="background:#ff1493"></span>
            </span>
            <span>Theme 3 — Y2K Nostalgia</span>
          </button>
        </div>
      </div>

    </div>

    <div class="header-center">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" class="search-input"
          placeholder="Search…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button class="search-clear" id="searchClear" aria-label="Clear">✕</button>
      </div>
    </div>

    <div class="header-right">
      <span class="track-count" id="trackCount"></span>
      <select class="sort-select" id="sortSelect" title="Sort">
        <option value="title">A – Z</option>
        <option value="artist">Artist</option>
        <option value="album">Album</option>
        <option value="newest">Newest</option>
      </select>
    </div>
  </header>

  <!-- ── MAIN GRID ───────────────────────────────────── -->
  <main class="main">

    <!-- Drop overlay -->
    <div class="drop-overlay" id="dropOverlay">
      <div class="drop-overlay-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop MP3s to add them</p>
      </div>
    </div>

    <div class="track-grid" id="trackGrid"></div>

    <div class="empty-state" id="emptyLibrary" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <p>No tracks yet.</p>
      <p class="empty-hint">Drop MP3s anywhere on the page, or push files to <code>audio/</code> and GitHub Actions will update the library automatically.</p>
    </div>
    <div class="empty-state" id="emptySearch" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <p>No results.</p>
    </div>

  </main>

  <!-- ── PLAYER BAR ──────────────────────────────────── -->
  <footer class="player">

    <div class="player-info">
      <div class="player-art" id="playerArt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="player-meta">
        <span class="player-title"  id="playerTitle">No track selected</span>
        <span class="player-artist" id="playerArtist">—</span>
      </div>
    </div>

    <div class="player-controls">
      <div class="player-buttons">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle (S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous (P)">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="2" height="16"/>
          </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause (Space)">
          <svg class="icon-play"  viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="5,3 19,12 5,21"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" hidden>
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next (N)">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="2" height="16"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
          </svg>
          <span class="repeat-one-badge" id="repeatOneBadge" hidden>1</span>
        </button>
      </div>
      <div class="seek-row">
        <span class="time-label" id="timeElapsed">0:00</span>
        <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1" />
        <span class="time-label" id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctrl-btn" id="muteBtn" title="Mute (M)">
        <svg class="icon-vol"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/>
        </svg>
        <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" hidden>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <input type="range" class="volume-bar" id="volumeBar" min="0" max="1" value="1" step="0.02" />
    </div>

  </footer>

  <audio id="audioEl" preload="metadata" playsinline></audio>
  <input type="file" id="fileInput" accept=".mp3,audio/*" multiple hidden />

  <!-- Y2K popup ads — only visible in theme 3 -->
  <div id="popupContainer"></div>

  <!-- Y2K slaying gif — bottom right corner, only visible in theme 3 -->
  <div id="slayingGif">
    <img src="slaying.gif" alt="slaying" />
  </div>

  <!-- Jumpscare overlay -->
  <div id="jumpscareOverlay">
    <img src="jumpscare.jpg" alt="" id="jumpscareImg" />
  </div>

  <script src="app.js"></script>
</body>
</html>
